<!-- 标题发光滤镜 -->
<filter id="titleGlow" x="-15%" y="-60%" width="130%" height="220%">
	<feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
	<feFlood flood-color="#00FFF6" flood-opacity="0.45" result="glowColor"/>
	<feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
	<feMerge>
		<feMergeNode in="glow"/>
		<feMergeNode in="SourceGraphic"/>
	</feMerge>
</filter>
<!-- 跑马灯扫光渐变 -->
<linearGradient id="shimmerGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="60" y2="0">
	<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
	<stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
	<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
	<animate attributeName="x1" values="-250;600" dur="2.8s" repeatCount="indefinite" calcMode="linear"/>
	<animate attributeName="x2" values="-180;670" dur="2.8s" repeatCount="indefinite" calcMode="linear"/>
</linearGradient>
